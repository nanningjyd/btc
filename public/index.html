<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五币联动监测 · 10s</title>
<link rel="icon" href="data:,">
<script src="echarts.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0f1216; color: #d8dee6; font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px; background: #141920; border-bottom: 1px solid #232a33; position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; }
.tabs { display: flex; gap: 6px; }
.tabs button { background: #1a2029; color: #aab4c0; border: 1px solid #28313d; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.tabs button.active { background: #185fa5; color: #fff; border-color: #185fa5; }
.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font-size: 12px; color: #8b97a5; background: #1a2029; border: 1px solid #28313d; border-radius: 10px; padding: 2px 9px; white-space: nowrap; }
.chip b { color: #d8dee6; font-weight: 500; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.dot.ok { background: #22a06b; } .dot.bad { background: #e04b4b; } .dot.mid { background: #ef9f27; }
.spacer { flex: 1; }
.vpngate-link { display: inline-block; background: #1a2029; color: #aab4c0; border: 1px solid #28313d; padding: 5px 12px; border-radius: 6px; font-size: 13px; text-decoration: none; white-space: nowrap; }
.vpngate-link:hover { border-color: #185fa5; color: #fff; }
select, button.act { background: #1a2029; color: #d8dee6; border: 1px solid #28313d; border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
.badge { padding: 4px 16px; background: #141920; border-bottom: 1px solid #232a33; color: #8b97a5; font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.badge .warn { color: #ef9f27; }
main { display: flex; gap: 12px; padding: 12px 16px; align-items: stretch; }
#chartPanel { flex: 1; min-width: 0; background: #141920; border: 1px solid #232a33; border-radius: 10px; padding: 10px; }
#mainChart { width: 100%; height: 460px; }
#cards { width: 330px; flex-shrink: 0; background: #141920; border: 1px solid #232a33; border-radius: 10px; padding: 10px; overflow-y: auto; max-height: 500px; }
#cards h3, section h3 { font-size: 13px; font-weight: 500; color: #aab4c0; margin-bottom: 8px; }
.card { border: 1px solid #28313d; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: #171d25; }
.card .hd { display: flex; justify-content: space-between; font-size: 12px; color: #8b97a5; margin-bottom: 4px; }
.card .hd b { color: #fff; font-weight: 500; }
.card .up { color: #e04b4b; } .card .down { color: #22a06b; }
.pred { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-top: 1px dashed #232a33; }
.pred:first-of-type { border-top: none; }
.pred .cd { color: #ef9f27; }
section.stats { display: grid; grid-template-columns: 1.15fr 1.15fr 0.9fr; gap: 12px; padding: 0 16px 16px; }
.block { background: #141920; border: 1px solid #232a33; border-radius: 10px; padding: 10px; min-width: 0; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 4px 7px; text-align: right; border-bottom: 1px solid #20262f; white-space: nowrap; }
th { color: #8b97a5; font-weight: 500; position: sticky; top: 0; background: #141920; }
td:first-child, th:first-child { text-align: left; }
tr:hover td { background: #171d25; }
.red { color: #e04b4b; } .green { color: #22a06b; } .muted { color: #6b7684; }
.filters { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
#histChart { width: 100%; height: 240px; }
#modalMask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; align-items: center; justify-content: center; }
#modalMask.show { display: flex; }
#modal { background: #141920; border: 1px solid #28313d; border-radius: 10px; padding: 18px; width: 380px; }
#modal h3 { margin-bottom: 12px; }
#modal label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #aab4c0; }
#modal input[type=number] { width: 110px; background: #1a2029; color: #d8dee6; border: 1px solid #28313d; border-radius: 6px; padding: 4px 8px; }
#modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
#modal .btns button { padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; }
#modal .ok { background: #185fa5; color: #fff; } #modal .cancel { background: #1a2029; color: #d8dee6; border: 1px solid #28313d !important; }
footer { padding: 8px 16px 20px; color: #55606d; font-size: 12px; }
.empty { color: #6b7684; padding: 30px; text-align: center; }
@media (max-width: 1100px) { main { flex-direction: column; } #cards { width: auto; max-height: 300px; } section.stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>五币联动监测</h1>
  <div class="tabs" id="tabs"></div>
  <div class="chips">
    <span class="chip" id="chipCloud">云采集 <b>…</b></span>
    <span class="chip" id="chipConn">实时 <span class="dot mid"></span></span>
    <span class="chip" id="chipRun">运行 <b>0s</b></span>
  </div>
  <div class="spacer"></div>
  <a class="vpngate-link" href="/vpngate">⌁ VPNGate 服务器</a>
  <select id="dateSel"><option value="today">今天</option><option value="yesterday">昨天</option></select>
  <button class="act" id="btnParams">参数</button>
</header>
<div class="badge" id="badge"></div>
<main>
  <div id="chartPanel"><div id="mainChart"></div></div>
  <aside id="cards"><h3>实时预测（BTC/ETH 拐点 → 山寨币跟随）</h3><div id="cardList"><div class="empty">等待拐点确认…</div></div></aside>
</main>
<section class="stats">
  <div class="block"><h3>滞后统计摘要（当天）</h3><div class="filters"></div><div id="statWrap" style="max-height:300px;overflow:auto"><table id="statTable"></table></div></div>
  <div class="block"><h3>时间差记录（当天）</h3>
    <div class="filters">
      <select id="fType"><option value="">全部类型</option><option value="bottom">谷底</option><option value="top">谷顶</option></select>
      <select id="fLeader"><option value="">全部主流币</option><option value="btc">BTC</option><option value="eth">ETH</option></select>
      <select id="fFollower"><option value="">全部跟随币</option><option value="sol">SOL</option><option value="bnb">BNB</option><option value="doge">DOGE</option><option value="xrp">XRP</option></select>
    </div>
    <div style="max-height:260px;overflow:auto"><table id="matchTable"></table></div>
  </div>
  <div class="block"><h3>lag 分布</h3>
    <div class="filters"><select id="histSel"></select></div>
    <div id="histChart"></div>
  </div>
</section>
<footer>谷底▲红 / 谷顶▼绿（红涨绿跌）· 基准=当日00:00 · 时间差=跟随币拐点−主流币拐点（秒）· 云端7×24采集，页面实时数据为本地直连 · 模式2（15min±1%）默认关闭，见参数</footer>
<div id="modalMask"><div id="modal">
  <h3>分析参数</h3>
  <label>转折反转阈值 (%) <input type="number" id="pThreshold" step="0.05" min="0.05" max="1"></label>
  <label>匹配窗口-前 (秒) <input type="number" id="pBefore" step="10"></label>
  <label>匹配窗口-后 (秒) <input type="number" id="pAfter" step="30"></label>
  <label>最小拐点间隔 (秒) <input type="number" id="pMinGap" step="10" min="0"></label>
  <label>模式2：15min ±1% 信号 <input type="checkbox" id="pMode2" style="width:18px;height:18px"></label>
  <div class="btns"><button class="cancel" id="pCancel">取消</button><button class="ok" id="pApply">应用</button></div>
</div></div>
<script src="app.js"></script>
</body>
</html>
